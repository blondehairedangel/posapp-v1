# =============================================================================
# Automotive Spare Parts ERP — application services
#
# This file deliberately does NOT contain a database. The application does not
# own its PostgreSQL instance: point DATABASE_URL at whatever you already run.
#
#   # Against your own PostgreSQL (set DATABASE_URL in .env):
#   docker compose up -d --build
#
#   # Or bring up a bundled PostgreSQL too, for evaluation:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
#     up -d --build
#
# DATABASE_URL is read from .env and is NOT overridden here, so .env is the
# single source of truth for the connection string.
# =============================================================================

name: sparepart-erp

services:
  # Runs migrations to completion before web/worker start, so two replicas
  # never race to apply the same migration.
  migrate:
    build:
      context: .
      # Dedicated stage: the Prisma CLI is a dev dependency and is deliberately
      # absent from the serving image.
      target: migrator
    restart: 'no'
    env_file: [.env]
    networks: [internal]

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      # The worker runs as its own service, so web replicas must not also
      # claim jobs.
      JOB_WORKER_ENABLED: 'false'
    volumes:
      - attachments:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Behind a reverse proxy (Coolify/Traefik/Caddy) this port need not be
    # published; the proxy joins the `web` network instead.
    ports:
      - '${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [internal, web]

  worker:
    build:
      context: .
      target: runner
    restart: unless-stopped
    command: ['node_modules/.bin/tsx', 'src/server/jobs/worker.ts']
    env_file: [.env]
    environment:
      NODE_ENV: production
      JOB_WORKER_ENABLED: 'true'
    volumes:
      # Shares attachment storage with web so inbound email attachments are
      # readable by the UI.
      - attachments:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The worker exposes no port; liveness is "the process is up".
      test: ['CMD', 'node', '-e', 'process.exit(0)']
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [internal]

volumes:
  attachments:
    driver: local

networks:
  internal:
    driver: bridge
  # Reverse proxies attach here to reach `web`.
  web:
    driver: bridge
  # ---------------------------------------------------------------------------
  # Reaching a PostgreSQL that lives in ANOTHER compose project
  # ---------------------------------------------------------------------------
  # If your database runs in a separate stack, the app containers must share a
  # network with it. Find the network name with `docker network ls`, then
  # declare it here as external and add it to the `migrate`, `web` and
  # `worker` service network lists:
  #
  #   dbnet:
  #     external: true
  #     name: my-postgres-stack_default
  #
  # With that in place, use the database's SERVICE name as the host in
  # DATABASE_URL (for example `postgres` or `db`), not localhost.
